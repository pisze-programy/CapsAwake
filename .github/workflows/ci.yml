name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test
        run: |
          xcodebuild \
            -project CapsAwake.xcodeproj \
            -scheme CapsAwake \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test
